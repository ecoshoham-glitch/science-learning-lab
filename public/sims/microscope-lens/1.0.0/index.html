<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>המיקרוסקופ של ליווינהוק</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lab" aria-labelledby="lab-title">
    <h1 id="lab-title" class="visually-hidden" data-i18n="title"></h1>

    <section class="bench" aria-labelledby="controls-title">
      <h2 id="controls-title" data-i18n="controls"></h2>

      <fieldset class="choice">
        <legend data-i18n="instrument"></legend>
        <label><input type="radio" name="instrument" value="ball" checked> <span data-i18n="ball"></span></label>
        <label><input type="radio" name="instrument" value="compound"> <span data-i18n="compound"></span></label>
      </fieldset>

      <div class="control" data-param="lensDiameter">
        <label for="lensDiameter"><span data-i18n="lensDiameter"></span> <output id="lensDiameter-out" for="lensDiameter" dir="ltr"></output></label>
        <input id="lensDiameter" type="range" dir="ltr" min="1" max="10" step="0.1" value="6">
        <div class="range-ends" dir="ltr" aria-hidden="true"><span>1 mm</span><span>10 mm</span></div>
        <p class="locked-note" id="lens-note" hidden></p>
      </div>

      <fieldset class="choice">
        <legend data-i18n="sample"></legend>
        <label><input type="radio" name="sample" value="cork" checked> <span data-i18n="cork"></span></label>
        <label><input type="radio" name="sample" value="pond"> <span data-i18n="pond"></span></label>
        <label><input type="radio" name="sample" value="blood"> <span data-i18n="blood"></span></label>
      </fieldset>

      <dl class="readout">
        <div><dt data-i18n="focal"></dt><dd id="focal" dir="ltr"></dd></div>
        <div><dt data-i18n="magnification"></dt><dd id="mag" dir="ltr"></dd></div>
      </dl>
    </section>

    <section class="view" aria-labelledby="view-title">
      <h2 id="view-title" data-i18n="view"></h2>
      <canvas id="field" width="360" height="360" role="img" aria-describedby="field-desc"></canvas>
      <p id="field-desc" class="field-desc" aria-live="polite"></p>
      <div class="found">
        <span data-i18n="found"></span>
        <ul id="found-list" class="found-list"></ul>
      </div>
      <details class="model">
        <summary data-i18n="modelTitle"></summary>
        <p data-i18n="modelText"></p>
      </details>
    </section>
  </main>

  <script src="sll-bridge.js"></script>
  <script src="model.js"></script>
  <script src="sim.js"></script>
</body>
</html>
